name: forward-monthly

# Paper only. Reads public data, places no orders, uses no account and no secrets.
# Commits computed results and a run log only, never raw data.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute only, commit nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install pinned tools
        run: |
          pip install numpy==2.4.6
          npm install -g dukascopy-node@1.51.1
      - name: Verify the freeze
        run: python audit/forward/verify_freeze.py
      - name: Hold until the first scheduled month
        # Before 2026-12-01 only a manual dry run goes ahead, so nothing is committed early.
        id: gate
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "$(date -u +%Y-%m-%d)" \< "2026-12-01" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Run the frozen code
        if: steps.gate.outputs.go == 'yes'
        run: |
          chmod +x audit/forward/ci/curl
          export PATH="$GITHUB_WORKSPACE/audit/forward/ci:$PATH"
          mkdir -p audit/forward/runs
          LOG="audit/forward/runs/$(date -u +%Y-%m).log"
          FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          set -o pipefail
          { date -u +%Y-%m-%dT%H:%M:%SZ; git rev-parse HEAD; python audit/forward/forward_update.py $FLAG; } 2>&1 | tee "$LOG"
          python audit/forward/summarize.py
      - name: Commit computed results only
        if: steps.gate.outputs.go == 'yes' && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/forward/FORWARD_SUMMARY.md audit/forward/runs
          [ -f audit/forward/FORWARD_LOG.csv ] && git add audit/forward/FORWARD_LOG.csv
          git diff --cached --quiet || git commit -m "Forward update $(date -u +%Y-%m)"
          git push
